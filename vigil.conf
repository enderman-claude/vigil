# vigil configuration  (/etc/vigil.conf)
#
# Format: key = value. A line starting with '#' or ';' is a comment.
# Inline comments are NOT supported (so '#' is usable as a bar character).
# When vigil starts as root, this file must be root-owned and not
# group/world-writable, otherwise it is ignored. Bad lines are reported to
# stderr (journalctl -u vigil@tty1) and skipped.
# Changes apply on restart:  systemctl restart vigil@tty1
# Command-line flags (-i, -u, -B) override this file.

# Refresh interval in seconds (1-60)
#interval = 1

# Unprivileged uid vigil drops to when started as root (1-65535)
#uid = 65534

# Keep the console from blanking/powering down
disable_blanking = yes

# Sections shown, in this order:
#   load psi cpu mem swap disk net bat cores
#sections = load,psi,cpu,mem,swap,disk,net,bat,cores

# Disks: "auto" = every real block-device mount (loop/ram/squashfs/erofs excluded, one line
# per device), or an explicit list of mount points.
# Avoid network mounts in the list: a hung server would stall the display.
#disks = auto
#disks = /,/boot,/home
# Max disk lines (1-16)
#disk_max = 8

# ---- Style ---------------------------------------------------------------
# Preset (applied first; the keys below override it):
#   classic  coloured '#' bars (green/yellow/red)
#   mono     same, no colour
#   levels   no colour; the bar character changes with the level: - = *
#style = classic

# Colour on/off (the preset decides the default)
#color = on

# Bar characters: one printable ASCII character each, e.g. - = _ * ~ # +
# 'space' is allowed for empty/left/right, 'none' for left/right.
#fill      = #       # sets low, mid and high at once
#fill_low  = -
#fill_mid  = =
#fill_high = *
#empty     = .
#left      = [
#right     = ]

# Level thresholds in percent: below warn = low, from warn = mid, from crit = high
#warn = 60
#crit = 85
# Bar width in cells (4-40); 0 = automatic from the screen width
#bar_width = 0

# Colours: black red green yellow blue magenta cyan white gray
#          bright-red bright-green bright-yellow bright-blue bright-magenta
#          bright-cyan bright-white none
#color_low   = green
#color_mid   = yellow
#color_high  = red
#color_empty = gray
#color_title = cyan
#color_dim   = gray

# Example: colourless bar that changes character with load
#style = mono
#fill_low  = -
#fill_mid  = =
#fill_high = *
